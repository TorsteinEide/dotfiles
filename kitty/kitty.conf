# for my sanity
enable_audio_bell no

mouse_map left press ungrabbed mouse_selection normal
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line

# for aesthetics

background_opacity 0.90
background_blur 70
background #f76f53
hide_window_decorations titlebar-only
window_padding_width 13
draw_minimal_borders yes

active_border_color #f76f53
inactive_border_color #732c6e

font_size 16.0
font_family      MesloLGM Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

placement_strategy center

tab_bar_style powerline
tab_powerline_style round

#for nvim kitty padding removal
allow_remote_control yes
listen_on none


# for navigation
kitty_mod cmd 
map kitty_mod+enter new_window
map kitty_mod+w close_window
map kitty_mod+l next_window
map kitty_mod+h previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+` move_window_to_top
map kitty_mod+r start_resizing_window


enabled_layouts tall:bias=50;full_size=1;mirroed=false

