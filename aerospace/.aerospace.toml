after-startup-command = [
  'exec-and-forget borders active_color=0xffFF6B66 inactive_color=0xff494d64 width=10.0'
]

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 60
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true 

[key-mapping]
    preset = 'qwerty'

#Tiling and Gaps start
[gaps]
    inner.horizontal = 30
    inner.vertical =   30
    outer.left =       20
    outer.bottom =     20
    outer.top =        20
    outer.right =      20
#Tiling and Gaps start

#Screen alignment start
[workspace-to-monitor-force-assignment]
Monitor1 = 'secondary'
Monitor2 = 'secondary'
Vaktmester = 'secondary'
M = 'main'
S = 'main'
T = 'main'
1 = 'main' 
2 = 'main' 
3 = 'main' 
#Screen alignment end 

[mode.main.binding]
    alt-enter = '''exec-and-forget
                    open -na ghostty
                '''
    alt-b = '''exec-and-forget
                    open -na firefox 
                '''


    alt-w = 'close'

    #Movement start
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    #Movement end

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    #Workspace start
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-q = 'workspace Monitor1'
    alt-e = 'workspace Monitor2'
    alt-v = 'workspace Vaktmester'
    alt-m = 'workspace Music'
    alt-s = 'workspace Slack'
    alt-t = 'workspace Teams'
    alt-o = 'workspace Outlook'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-q = 'move-node-to-workspace Monitor1'
    alt-shift-e = 'move-node-to-workspace Monitor2'
    alt-shift-v = 'move-node-to-workspace Vaktmester'
    alt-shift-m = 'move-node-to-workspace Music'
    alt-shift-s = 'move-node-to-workspace Slack'
    alt-shift-t = 'move-node-to-workspace Teams'
    alt-shift-o = 'move-node-to-workspace Outlook'
    alt-tab = 'workspace-back-and-forth'
    #Workspace end 

#default start
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    #utilities start
    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
    #utilities end
#default end 
